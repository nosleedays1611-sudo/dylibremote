name: Build RemoteAuth dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "RemoteAuth.mm"
      - "icon.gif"
      - "build.sh"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FILES"
          echo "========================================"

          pwd
          find . -maxdepth 3 -type f | sort

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          test -f RemoteAuth.mm || {
            echo "ERRO: RemoteAuth.mm nao encontrado"
            exit 1
          }

          test -f icon.gif || {
            echo "ERRO: icon.gif nao encontrado"
            exit 1
          }

          echo "Source OK"

      - name: Build RemoteAuth dylib
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build artifact
          mkdir -p build

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "========================================"
          echo "SDK"
          echo "========================================"
          echo "$SDK_PATH"

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -std=c++17 \
            -fobjc-arc \
            -fvisibility=hidden \
            -dynamiclib \
            RemoteAuth.mm \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -framework ImageIO \
            -framework CoreGraphics \
            -framework QuartzCore \
            -o build/RemoteAuth.dylib

      - name: Validate dylib
        shell: bash
        run: |
          set -euo pipefail

          test -f build/RemoteAuth.dylib || {
            echo "ERRO: RemoteAuth.dylib nao foi criada"
            exit 1
          }

          echo "========================================"
          echo "REMOTE AUTH BUILD OK"
          echo "========================================"

          echo
          echo "FILE:"
          file build/RemoteAuth.dylib

          echo
          echo "ARQUITETURA:"
          lipo -info build/RemoteAuth.dylib || true

          echo
          echo "DEPENDENCIAS:"
          otool -L build/RemoteAuth.dylib

          echo
          echo "TAMANHO:"
          ls -lh build/RemoteAuth.dylib

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp build/RemoteAuth.dylib artifact/RemoteAuth.dylib
          cp icon.gif artifact/icon.gif

          echo "========================================"
          echo "ARTIFACT CONTENT"
          echo "========================================"

          ls -lah artifact

      - name: Upload RemoteAuth
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAuth-dylib
          path: artifact/
          if-no-files-found: error
          retention-days: 30
