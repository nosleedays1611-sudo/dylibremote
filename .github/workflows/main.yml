name: Build RemoteAuth dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "RemoteAuth.mm"
      - "icon.gif"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail

          test -f RemoteAuth.mm || {
            echo "ERRO: RemoteAuth.mm nao encontrado"
            exit 1
          }

          test -f icon.gif || {
            echo "ERRO: icon.gif nao encontrado"
            exit 1
          }

          echo "Arquivos encontrados:"
          ls -lh RemoteAuth.mm icon.gif

      - name: Build RemoteAuth dylib
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build artifact
          mkdir -p build artifact

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "SDK:"
          echo "$SDK_PATH"

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fvisibility=hidden \
            -O2 \
            -dynamiclib \
            RemoteAuth.mm \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework QuartzCore \
            -framework ImageIO \
            -framework CoreGraphics \
            -Wl,-install_name,@rpath/RemoteAuth.dylib \
            -Wl,-dead_strip \
            -Wl,-sectcreate,__DATA,__eaicon,icon.gif \
            -o build/RemoteAuth.dylib

      - name: Remove signature
        shell: bash
        run: |
          set -euo pipefail

          codesign --remove-signature build/RemoteAuth.dylib 2>/dev/null || true

      - name: Validate dylib
        shell: bash
        run: |
          set -euo pipefail

          test -f build/RemoteAuth.dylib || {
            echo "ERRO: RemoteAuth.dylib nao foi criada"
            exit 1
          }

          echo "========================================"
          echo "REMOTE AUTH BUILD OK"
          echo "========================================"

          echo
          echo "Arquivo:"
          file build/RemoteAuth.dylib

          echo
          echo "Arquitetura:"
          lipo -info build/RemoteAuth.dylib || true

          echo
          echo "Dependencias:"
          otool -L build/RemoteAuth.dylib

          echo
          echo "Install name:"
          otool -D build/RemoteAuth.dylib || true

          echo
          echo "Secao do GIF:"
          otool -l build/RemoteAuth.dylib | grep -A6 "__eaicon" || true

          echo
          echo "Tamanho:"
          ls -lh build/RemoteAuth.dylib

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          cp build/RemoteAuth.dylib artifact/RemoteAuth.dylib

          shasum -a 256 build/RemoteAuth.dylib \
            > artifact/RemoteAuth.dylib.sha256.txt

          echo "Artifact:"
          ls -lah artifact

      - name: Upload RemoteAuth
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAuth-dylib
          path: artifact/
          if-no-files-found: error
          retention-days: 30
